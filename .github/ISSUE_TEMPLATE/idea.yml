name: Idea or missing feature
description: Something you need for your work that Naqsh does not do yet.
labels: [idea, triage]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to make, and what stops you?
      description: Describe the job (a sign, a door panel, a ring…) rather than a button.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Another program, a workaround, by hand…
  - type: input
    id: version
    attributes:
      label: Naqsh version (Help › About)
